[package]
name = "hwpay"
version = "0.1.0"
edition = "2021"
description = "Hardware-secured payment processor with TPM support for Polkadot, Penumbra, and Stripe"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hitchhooker/hwpay"
keywords = ["payments", "tpm", "polkadot", "penumbra", "stripe"]
categories = ["cryptography", "web-programming"]

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# crypto primitives
schnorrkel = "0.11"
blake3 = "1.5"
blake2b_simd = "1.0"
bs58 = "0.5"
sha2 = "0.10"
rand = "0.8"

# hardware security (TPM 2.0)
tss-esapi = "7.5"
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# encrypted fallback storage
argon2 = "0.5"
chacha20poly1305 = "0.10"

# polkadot (subxt)
subxt = { version = "0.38", features = ["substrate-compat", "native"] }
# subxt-lightclient = "0.38"  # TODO: re-enable when API is stable

# penumbra (optional, heavy deps)
penumbra-sdk-keys = { version = "2.1", optional = true }
penumbra-sdk-num = { version = "2.1", optional = true }
# rpc feature enables view_service_client for grpc
penumbra-sdk-proto = { version = "2.1", optional = true, features = ["rpc"] }
# penumbra-sdk-view brings rusqlite which conflicts with sqlx-sqlite
# we only need the grpc client from proto, not the full view service
penumbra-sdk-asset = { version = "2.1", optional = true }

# grpc
tonic = { version = "0.12", optional = true }

# http client (for stripe, penumbra rpc)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# stripe webhook verification
hmac = "0.12"

# logging
tracing = "0.1"

# time
chrono = { version = "0.4", features = ["serde"] }

# uuid for account ids
uuid = { version = "1", features = ["v4", "serde"] }

# async traits
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
# enable penumbra support (adds penumbra dependencies)
penumbra = [
    "penumbra-sdk-keys",
    "penumbra-sdk-num",
    "penumbra-sdk-proto",
    "penumbra-sdk-asset",
    "tonic",
]

[[example]]
name = "penumbra_test"
required-features = ["penumbra"]
